<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Gênero</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .container {
            width: 50%;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            color: #555;
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .errorlist {
            color: red;
            margin: 5px 0 0 0;
            list-style: none;
            padding: 0;
        }
    </style>
</head>
<body>

    <h1>Cadastro de Gênero</h1>

    <div class="container">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="name">Gênero</label>
                <input type="text" name="name" placeholder="Digite o nome do gênero" required>
                {% if error %}
                    <ul class="errorlist">
                        <li>{{ error }}</li>
                    </ul>
                {% endif %}
            </div>

            <button type="submit">Salvar</button>
        </form>
    </div>
</body>
</html>
